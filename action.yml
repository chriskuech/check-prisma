name: 'Check Prisma Migrations'
description: >-
  Validates Prisma migrations for an npm project by resetting the database
  to the pull request's base branch, applying the base branch's migrations,
  then applying the pull request's migrations and checking that no pending
  schema changes remain.
author: 'Chris Kuech'

branding:
  icon: 'database'
  color: 'purple'

inputs:
  path:
    description: >-
      Path to the npm project root, relative to the repository root. Must
      contain package.json and a prisma/schema.prisma file.
    required: false
    default: '.'
  node-version:
    description: 'Node.js version to use.'
    required: false
    default: '22'
  max-risk:
    description: >-
      Maximum migration risk level to allow, as assessed by pgfence. One of:
      low, medium, high, critical.
    required: false
    default: 'low'
  base-ref:
    description: >-
      Git ref to check out as the base branch. Defaults to the pull
      request's base commit. Mainly useful for testing this action outside
      of a real pull request -- most callers should leave this unset.
    required: false
    default: ''
  head-ref:
    description: >-
      Git ref to check out as the PR branch. Defaults to the pull request's
      head commit. Mainly useful for testing this action outside of a real
      pull request -- most callers should leave this unset.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Validate max-risk input
      shell: bash
      run: |
        case "${{ inputs.max-risk }}" in
          low|medium|high|critical) ;;
          *)
            echo "::error::Invalid max-risk '${{ inputs.max-risk }}'. Must be one of: low, medium, high, critical." >&2
            exit 1
            ;;
        esac

    # actions/checkout doesn't just add/overwrite files -- it deletes the
    # *entire* contents of its target directory first. The "Checkout base
    # branch"/"Checkout PR branch" steps below target the job's default
    # working directory, which for a locally-referenced action
    # (`uses: ./`) is the *same* directory github.action_path resolves
    # to -- so without this, those checkouts would wipe out this action's
    # own scripts/*.sh before the steps below can run them. (For a
    # normally-referenced action, e.g. `uses: kuech/check-prisma@v1`,
    # github.action_path is already a separate directory those checkouts
    # never touch, so this step is a harmless no-op copy there -- but
    # nothing here should assume that's always true.)
    - name: Stage scripts (survive base/head checkouts overwriting the workspace)
      id: stage_scripts
      shell: bash
      run: |
        dir="$(mktemp -d)"
        cp -r "${{ github.action_path }}/scripts" "$dir/scripts"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

    - name: Start PostgreSQL
      shell: bash
      run: |
        docker run -d --name check-prisma-postgres \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=test \
          -p 5432:5432 \
          pgvector/pgvector:pg17

        echo "Waiting for PostgreSQL to be ready..."
        for i in $(seq 1 30); do
          if docker exec check-prisma-postgres pg_isready -U postgres > /dev/null 2>&1; then
            echo "PostgreSQL is ready"
            exit 0
          fi
          sleep 2
        done
        echo "PostgreSQL did not become ready in time" >&2
        exit 1

    - name: Checkout base branch
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.base-ref || github.event.pull_request.base.sha }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.path }}/package-lock.json

    - name: Install dependencies (base branch)
      shell: bash
      working-directory: ${{ inputs.path }}
      run: npm ci

    # DIRECT_DATABASE_URL is set alongside DATABASE_URL because a schema
    # with a `directUrl` datasource field (used to bypass a pooler for DDL,
    # e.g. via pgbouncer in production) requires that env var to resolve for
    # schema validation, even though this action's single ephemeral Postgres
    # has no pooler for it to actually bypass. Harmless to set unconditionally
    # for schemas that don't declare directUrl -- Prisma just ignores it.
    - name: Apply migrations from base branch
      shell: bash
      working-directory: ${{ inputs.path }}
      run: bash "${{ steps.stage_scripts.outputs.dir }}/scripts/reset-database.sh"
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
        DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test

    # Snapshotted before the "Checkout PR branch" step below overwrites the
    # workspace -- analyze-risk.sh needs base's own set of migration folder
    # names to tell which of the PR branch's migrations are new, and this is
    # the last point base's checkout is still on disk. Lands next to the
    # staged scripts (same tmpdir, same reason: survives being overwritten).
    - name: Snapshot base branch migrations (for diff-scoped risk analysis)
      id: snapshot_base_migrations
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        dir="${{ steps.stage_scripts.outputs.dir }}/base-migrations"
        mkdir -p "$dir"
        if [ -d prisma/migrations ]; then
          cp -r prisma/migrations/. "$dir/"
        fi
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.head-ref || github.event.pull_request.head.sha }}

    - name: Install dependencies (PR branch)
      shell: bash
      working-directory: ${{ inputs.path }}
      run: npm ci

    - name: Analyze migration risk
      shell: bash
      working-directory: ${{ inputs.path }}
      run: bash "${{ steps.stage_scripts.outputs.dir }}/scripts/analyze-risk.sh" "${{ inputs.max-risk }}" "${{ steps.snapshot_base_migrations.outputs.dir }}"

    - name: Apply migrations from PR branch
      shell: bash
      working-directory: ${{ inputs.path }}
      run: bash "${{ steps.stage_scripts.outputs.dir }}/scripts/deploy-migrations.sh"
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
        DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test

    - name: Check for pending schema changes
      shell: bash
      working-directory: ${{ inputs.path }}
      run: bash "${{ steps.stage_scripts.outputs.dir }}/scripts/check-schema-drift.sh"
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
        DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test

    - name: Stop PostgreSQL
      if: always()
      shell: bash
      run: docker rm -f check-prisma-postgres
