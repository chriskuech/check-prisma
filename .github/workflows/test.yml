name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # test fixture branches are pushed and deleted by this workflow

jobs:
  shellcheck-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check script syntax
        run: |
          for f in scripts/*.sh test/*.sh test/lib/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

  functional:
    needs: shellcheck-syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Prisma 6 and 7 use different `prisma migrate diff` flags (see
        # scripts/check-schema-drift.sh) and different datasource-config
        # mechanisms (schema.prisma vs. prisma.config.ts). Every scenario
        # runs against both to make sure the action keeps working across
        # the full supported range (Prisma >= 6).
        prisma-version: ['6', '7']
        scenario:
          - name: valid
            base: clean
            head: valid-head
            expect: success
          - name: pgfence-risk
            base: clean
            head: pgfence-risk-head
            expect: failure
          - name: schema-drift
            base: clean
            head: schema-drift-head
            expect: failure
          - name: invalid-migration-sql
            base: clean
            head: invalid-sql-head
            expect: failure
          - name: bad-seed
            base: bad-seed-base
            head: bad-seed-base # unreachable -- reset fails on the base branch's seed before head is ever checked out
            expect: failure

    steps:
      # Checked out to a directory OUTSIDE GITHUB_WORKSPACE (a sibling of
      # it), not `./` or a subdirectory of it. `uses:` doesn't accept
      # dynamic expressions for the action reference (neither the `github`
      # nor even the `env` context are recognized there -- it's resolved
      # before those are available), which rules out pointing
      # `uses: owner/repo@ref` at this commit. And a local path *inside*
      # GITHUB_WORKSPACE doesn't survive either: actions/checkout deletes
      # the *entire* contents of its target directory before checking out,
      # and the action's own internal checkouts of base-ref/head-ref (which
      # have no `path:` override) target GITHUB_WORKSPACE itself -- wiping
      # out anything nested inside it, action-src included.
      #
      # A sibling directory one level up is outside that blast radius:
      # `uses: ../action-src` (a genuine, if less common, path GitHub
      # Actions supports -- see actions/checkout's `allow_parent_path`)
      # keeps the action's own scripts/*.sh available no matter what the
      # action's internal checkouts do inside GITHUB_WORKSPACE.
      - name: Checkout action under test
        uses: actions/checkout@v4
        with:
          path: ../action-src
          allow_parent_path: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Assembles this scenario's base/head fixtures and pushes each as its
      # own throwaway branch, so the composite action below can be invoked
      # exactly as a real pull request would: through real `actions/checkout`
      # refs, not a reimplementation of its steps.
      - name: Push base fixture branch
        id: base_fixture
        run: |
          branch="test-fixtures/${{ github.run_id }}-${{ matrix.prisma-version }}-${{ matrix.scenario.name }}-base"
          sha="$(bash ../action-src/test/lib/push-fixture-branch.sh "../action-src/test/fixtures/scenarios/${{ matrix.scenario.base }}" "${{ matrix.prisma-version }}" "$branch")"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # Heredoc form, not `echo "sha=$sha"`: robust even if $sha ever
          # ends up spanning multiple lines, which would otherwise corrupt
          # $GITHUB_OUTPUT and fail every step reading from it.
          {
            echo "sha<<PUSH_FIXTURE_SHA_EOF"
            echo "$sha"
            echo "PUSH_FIXTURE_SHA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push head fixture branch
        id: head_fixture
        run: |
          branch="test-fixtures/${{ github.run_id }}-${{ matrix.prisma-version }}-${{ matrix.scenario.name }}-head"
          sha="$(bash ../action-src/test/lib/push-fixture-branch.sh "../action-src/test/fixtures/scenarios/${{ matrix.scenario.head }}" "${{ matrix.prisma-version }}" "$branch")"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          {
            echo "sha<<PUSH_FIXTURE_SHA_EOF"
            echo "$sha"
            echo "PUSH_FIXTURE_SHA_EOF"
          } >> "$GITHUB_OUTPUT"

      # `path: .` is relative to the job's default working directory
      # (GITHUB_WORKSPACE, where base-ref/head-ref land), not action-src.
      # The action checks out base-ref, applies its migrations (and seed),
      # checks out head-ref, analyzes and applies its migrations, then
      # checks for schema drift -- starting and stopping its own disposable
      # Postgres along the way. This step is expected to fail for some
      # scenarios, so failures are captured rather than failing the job
      # outright.
      - name: Run check-prisma action
        id: run_action
        continue-on-error: true
        uses: ../action-src
        with:
          path: .
          max-risk: low
          base-ref: ${{ steps.base_fixture.outputs.sha }}
          head-ref: ${{ steps.head_fixture.outputs.sha }}

      - name: Verify outcome matches expectation
        run: |
          actual="${{ steps.run_action.outcome }}"
          expected="${{ matrix.scenario.expect }}"
          echo "[${{ matrix.scenario.name }} (prisma ${{ matrix.prisma-version }})] action outcome: $actual (expected: $expected)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected the action to $expected, but it $actual"
            exit 1
          fi

      - name: Delete fixture branches
        if: always()
        run: |
          git push --quiet origin --delete "refs/heads/${{ steps.base_fixture.outputs.branch }}" 2>/dev/null || true
          git push --quiet origin --delete "refs/heads/${{ steps.head_fixture.outputs.branch }}" 2>/dev/null || true
        working-directory: ../action-src
