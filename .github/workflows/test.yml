name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # test fixture branches are pushed and deleted by this workflow

jobs:
  shellcheck-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check script syntax
        run: |
          for f in scripts/*.sh test/*.sh test/lib/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

  functional:
    needs: shellcheck-syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Prisma 6 and 7 use different `prisma migrate diff` flags (see
        # scripts/check-schema-drift.sh) and different datasource-config
        # mechanisms (schema.prisma vs. prisma.config.ts). Every scenario
        # runs against both to make sure the action keeps working across
        # the full supported range (Prisma >= 6).
        prisma-version: ['6', '7']
        scenario:
          - name: valid
            base: clean
            head: valid-head
            expect: success
          - name: pgfence-risk
            base: clean
            head: pgfence-risk-head
            expect: failure
          - name: schema-drift
            base: clean
            head: schema-drift-head
            expect: failure
          - name: invalid-migration-sql
            base: clean
            head: invalid-sql-head
            expect: failure
          - name: bad-seed
            base: bad-seed-base
            head: bad-seed-base # unreachable -- reset fails on the base branch's seed before head is ever checked out
            expect: failure

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Assembles this scenario's base/head fixtures and pushes each as its
      # own throwaway branch, so the composite action below can be invoked
      # exactly as a real pull request would: through real `actions/checkout`
      # refs, not a reimplementation of its steps.
      - name: Push base fixture branch
        id: base_fixture
        run: |
          branch="test-fixtures/${{ github.run_id }}-${{ matrix.prisma-version }}-${{ matrix.scenario.name }}-base"
          sha="$(bash test/lib/push-fixture-branch.sh "test/fixtures/scenarios/${{ matrix.scenario.base }}" "${{ matrix.prisma-version }}" "$branch")"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # Heredoc form, not `echo "sha=$sha"`: robust even if $sha ever
          # ends up spanning multiple lines, which would otherwise corrupt
          # $GITHUB_OUTPUT and fail every step reading from it.
          {
            echo "sha<<PUSH_FIXTURE_SHA_EOF"
            echo "$sha"
            echo "PUSH_FIXTURE_SHA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push head fixture branch
        id: head_fixture
        run: |
          branch="test-fixtures/${{ github.run_id }}-${{ matrix.prisma-version }}-${{ matrix.scenario.name }}-head"
          sha="$(bash test/lib/push-fixture-branch.sh "test/fixtures/scenarios/${{ matrix.scenario.head }}" "${{ matrix.prisma-version }}" "$branch")"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          {
            echo "sha<<PUSH_FIXTURE_SHA_EOF"
            echo "$sha"
            echo "PUSH_FIXTURE_SHA_EOF"
          } >> "$GITHUB_OUTPUT"

      # The action being tested, referenced the same way a real consumer
      # would (`uses: owner/repo@ref`), just pointed at this commit instead
      # of a release tag. This -- not `uses: ./` -- is what makes
      # github.action_path resolve to Actions' own isolated checkout of the
      # action (under _actions/, never touched by any actions/checkout step
      # targeting GITHUB_WORKSPACE), matching real-world behavior: the
      # action's own internal checkouts of base-ref/head-ref land in
      # GITHUB_WORKSPACE and can't overwrite the scripts/*.sh it needs to
      # run afterward. `uses: ./` (or a local `path:` subdirectory of the
      # same workspace) can't get this right, because GITHUB_WORKSPACE is
      # exactly what those checkouts overwrite.
      #
      # This step is expected to fail for some scenarios, so its failure is
      # captured rather than failing the job outright.
      - name: Run check-prisma action
        id: run_action
        continue-on-error: true
        uses: chriskuech/check-prisma@${{ github.event.pull_request.head.sha || github.sha }}
        with:
          path: .
          max-risk: low
          base-ref: ${{ steps.base_fixture.outputs.sha }}
          head-ref: ${{ steps.head_fixture.outputs.sha }}

      - name: Verify outcome matches expectation
        run: |
          actual="${{ steps.run_action.outcome }}"
          expected="${{ matrix.scenario.expect }}"
          echo "[${{ matrix.scenario.name }} (prisma ${{ matrix.prisma-version }})] action outcome: $actual (expected: $expected)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected the action to $expected, but it $actual"
            exit 1
          fi

      # The action's own checkouts (base-ref, then head-ref) overwrite this
      # job's workspace with fixture content, but leave its git metadata
      # (the `origin` remote and persisted checkout credentials) intact --
      # that's all `git push --delete` needs.
      - name: Delete fixture branches
        if: always()
        run: |
          git push --quiet origin --delete "refs/heads/${{ steps.base_fixture.outputs.branch }}" 2>/dev/null || true
          git push --quiet origin --delete "refs/heads/${{ steps.head_fixture.outputs.branch }}" 2>/dev/null || true
